<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.8; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    .pulse-bg { animation: pulse 6s infinite ease-in-out; transform-origin: center; }
    .floating-card { animation: float 4s infinite ease-in-out; }
    .flow-line { stroke-dasharray: 8 8; animation: dash 2s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg-grad)" rx="12" />
  
  <!-- Glowing background shapes -->
  <circle cx="200" cy="150" r="140" fill="url(#glow-grad)" class="pulse-bg" filter="url(#glow)" opacity="0.4" />
  <circle cx="1000" cy="120" r="160" fill="url(#accent-grad)" class="pulse-bg" filter="url(#glow)" opacity="0.2" />

  <!-- Grid Lines Overlay -->
  <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200" stroke="#334155" stroke-opacity="0.3" stroke-width="1" />
  <path d="M200 0 V300 M400 0 V300 M600 0 V300 M800 0 V300 M1000 0 V300" stroke="#334155" stroke-opacity="0.3" stroke-width="1" />

  <!-- Flow Lines (Orchestration Routing Visual) -->
  <path d="M150 150 C300 80, 450 80, 600 150 C750 220, 900 220, 1050 150" fill="none" stroke="url(#accent-grad)" stroke-width="3" class="flow-line" />
  <path d="M150 150 C300 220, 450 220, 600 150 C750 80, 900 80, 1050 150" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6" class="flow-line" />

  <!-- Floating Platform Nodes -->
  <g class="floating-card">
    <rect x="90" y="120" width="120" height="60" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <text x="150" y="155" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Merchant API</text>
  </g>

  <g class="floating-card" style="animation-delay: -1s;">
    <rect x="520" y="105" width="160" height="90" rx="12" fill="#1e1b4b" stroke="url(#accent-grad)" stroke-width="3" filter="url(#glow)" />
    <text x="600" y="145" fill="#a855f7" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SMART ROUTER</text>
    <text x="600" y="170" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">Orchestration</text>
  </g>

  <g class="floating-card" style="animation-delay: -2s;">
    <rect x="990" y="70" width="120" height="50" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="1050" y="100" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">PSP Alpha</text>
  </g>

  <g class="floating-card" style="animation-delay: -1.5s;">
    <rect x="990" y="180" width="120" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="1050" y="210" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">PSP Beta</text>
  </g>

  <!-- Title Text -->
  <text x="600" y="55" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="900" letter-spacing="1.5" text-anchor="middle">PAYMENT ORCHESTRATION PLATFORMS</text>
  <text x="600" y="260" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="500" letter-spacing="3" text-anchor="middle">AWESOME CURATED ECOSYSTEM • SAAS &amp; OPEN-SOURCE</text>
</svg>
